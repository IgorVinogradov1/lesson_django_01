<!DOCTYPE html>
<html lang="ru" data-playable-focus-source="initial">
  <head>
    <title>Пример подключения плеера</title>
    <meta charset="utf-8">
    <link rel="icon" type="image/png" href="static/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="static/favicon/favicon.svg" />
    <link rel="shortcut icon" href="static/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="static/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="static/favicon/site.webmanifest" />

    <link rel="stylesheet" href="static/css/font-awesome.min.css">
    <link rel="stylesheet" href="static/css/style.css">
  </head>
  <body>
    <div id="player" class="player-shadow flexible-player">
        <div class="js-video-container flexible-player spacer"></div>
        <div class="control-panel">
          <button class="js-play-button player-buttons"><i class="fa fa-play" aria-hidden="true"></i></button>
          <button class="js-pause-button player-buttons" hidden><i class="fa fa-pause" aria-hidden="true"></i></button>
          <button class="js-volume-button player-buttons"><i class="fa fa-volume-off" aria-hidden="true"></i></button>
          <button class="js-mute-button player-buttons" hidden><i class="fa fa-volume-up" aria-hidden="true"></i></button>
          <div class="spacer"></div>
          <button class="js-fullscreen-button player-buttons"><i class="fa fa-expand" aria-hidden="true"></i></button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://unpkg.com/playable@2.10.3/dist/statics/playable.bundle.min.js"></script>
    <script src="static/js/player.js"></script>

    <script type="text/javascript">
      createPlayer({elementId: 'player'});
    </script>
    
  </body>

</html>
